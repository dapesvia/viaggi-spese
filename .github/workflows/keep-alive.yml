name: Supabase Keep Alive

on:
  schedule:
    # Run every 3 days at 09:00 UTC
    - cron: '0 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Error: Secrets VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY not set."
            exit 1
          fi
          
          echo "Pinging Supabase database to prevent inactivity pause..."
          response=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$SUPABASE_URL/rest/v1/trips?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
            
          if [ "$response" -eq 200 ] || [ "$response" -eq 201 ]; then
            echo "Success! Database responded with $response."
          else
            echo "Warning: Database responded with $response. This might still count as activity."
          fi
